name = "kopi-kompas"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The Gemini key is NEVER written here — this file is committed.
# Set it with:   npx wrangler secret put GEMINI_API_KEY
# Check it with: npx wrangler secret list

# A daily cap per install id, not a per-minute burst limit. The Worker URL
# ships inside the APK, so anyone who unzips it has the endpoint; they cannot
# reach the key, but they can spend the Gemini free-tier quota through it.
# That quota is counted per day, so the ceiling is too. Cloudflare's built-in
# ratelimit binding (which Pollie uses) only offers 10s and 60s windows and
# cannot express this. The namespace id is an identifier, not a secret.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e442b227afa64ce0998353fa48e928fa"

# Pinned, never an alias. gemini-2.5-flash is listed by ListModels but refuses
# new API keys ("no longer available to new users"), so this had to move up.
# Keep it a concrete version: every stored score records the model that
# produced it, and `gemini-flash-latest` would keep writing one name while the
# model underneath changed.
[vars]
GEMINI_MODEL = "gemini-3.6-flash"
